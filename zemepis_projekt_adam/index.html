<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Parlamentní volby - Interaktivní vizualizace</title>
    <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
    <div id="info-panel">
        <h1>Parlamentní volby - Vizualizace</h1>
        <div id="country-info" class="hidden">
            <h2 id="country-name"></h2>
            <p id="country-population"></p>
            <p id="country-capital"></p>
        </div>
    </div>

    <div id="control-panel" class="hidden">
        <h3 id="control-country-name">Vyberte zemi</h3>
        <div id="coordinates">
            <span id="coord-lat">Lat: 0°</span>
            <span id="coord-lon">Lon: 0°</span>
        </div>
        <div id="arrow-controls">
            <div class="arrow-row">
                <button class="arrow-btn" id="btn-up">↑</button>
            </div>
            <div class="arrow-row">
                <button class="arrow-btn" id="btn-left">←</button>
                <button class="arrow-btn" id="btn-down">↓</button>
                <button class="arrow-btn" id="btn-right">→</button>
            </div>
        </div>
        <div id="step-controls">
            <label>
                <input type="radio" name="step" value="1" checked> 1°
            </label>
            <label>
                <input type="radio" name="step" value="5"> 5°
            </label>
        </div>
        <button id="btn-execute">Execute / Export</button>
    </div>

    <div id="globe-container"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for mouse interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="js/globe.js?v=15"></script>
    <script src="js/main.js?v=15"></script>
</body>
</html>
